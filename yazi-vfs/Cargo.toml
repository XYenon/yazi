[package]
name        = "yazi-vfs"
version     = "26.2.2"
edition     = "2024"
license     = "MIT"
authors     = [ "sxyazi <sxyazi@gmail.com>" ]
description = "Yazi virtual file system"
homepage    = "https://yazi-rs.github.io"
repository  = "https://github.com/sxyazi/yazi"

[lints]
workspace = true

[dependencies]
yazi-config = { path = "../yazi-config", version = "26.2.2" }
yazi-fs     = { path = "../yazi-fs", version = "26.2.2" }
yazi-macro  = { path = "../yazi-macro", version = "26.2.2" }
yazi-sftp   = { path = "../yazi-sftp", version = "26.2.2" }
yazi-shared = { path = "../yazi-shared", version = "26.2.2" }

# External dependencies
anyhow      = { workspace = true }
bytes       = "1"
deadpool    = { version = "0.12.3", default-features = false, features = [ "managed", "rt_tokio_1" ] }
either      = { workspace = true }
futures     = { workspace = true }
hashbrown   = { workspace = true }
opendal     = { version = "0.55", features = ["services-fs", "services-http", "services-memory", "services-s3", "services-ftp", "services-webdav"] }
parking_lot = { workspace = true }
tempfile    = "3.10"
russh       = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
typed-path  = { workspace = true }
